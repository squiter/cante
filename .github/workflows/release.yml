name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build macOS binaries
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build release binaries
        run: swift build -c release

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME:-manual}"
          ARCH="$(uname -m)"
          DIST_DIR="cante-${VERSION}-macos-${ARCH}"

          mkdir -p "$DIST_DIR"
          cp .build/release/cante "$DIST_DIR/"
          cp .build/release/cante-overlay "$DIST_DIR/"
          cp .build/release/cante-spotify "$DIST_DIR/"
          cp .build/release/cante-lyrics "$DIST_DIR/"
          cp README.md LICENSE "$DIST_DIR/"

          cat > "$DIST_DIR/INSTALL.md" <<'EOF'
          # Cante Install

          Run Cante from this folder:

          ```sh
          ./cante run
          ```

          Stop the overlay:

          ```sh
          ./cante stop
          ```

          Clear cached lyrics:

          ```sh
          ./cante clear-cache
          ```

          Keep `cante`, `cante-overlay`, `cante-spotify`, and `cante-lyrics` together in the same folder.
          EOF

          tar -czf "${DIST_DIR}.tar.gz" "$DIST_DIR"
          shasum -a 256 "${DIST_DIR}.tar.gz" > "${DIST_DIR}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cante-macos-release
          path: |
            cante-*.tar.gz
            cante-*.tar.gz.sha256

      - name: Attach archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cante-*.tar.gz
            cante-*.tar.gz.sha256
